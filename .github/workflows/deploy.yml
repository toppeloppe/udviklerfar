name: Deploy til webhotel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ ftp.udviklerfar.dk }}
          username: ${{ Torben@udviklerfar.dk }}
          password: ${{ !Ld98hAUkFtbdN2 }}
          protocol: ftps
          local-dir: dist/
          server-dir: ${{ secrets.FTP_DIR || 'public_html/' }}
